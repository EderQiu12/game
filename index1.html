<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏大厅</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e1e;
            color: white;
            padding: 20px 50px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .back-btn {
            display: none;
            background: #333;
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        .back-btn:hover { background: #444; }
        #game-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            background-color: #2d2d2d;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid #444;
            transition: 0.2s;
        }
        .game-card:hover {
            background-color: #3e3e3e;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .game-icon { font-size: 40px; margin-bottom: 10px; }
        .game-name { font-size: 16px; font-weight: bold; text-align: center; padding: 0 10px;}
        .dir-card { background-color: #2a3b4c; border-color: #3e5368; }
        .dir-card:hover { background-color: #354b61; }
    </style>
</head>
<body>

    <div class="header">
        <a href="./" class="back-btn" id="back-btn">⬅ 返回上一级</a>
        <h1 id="page-title" style="margin: 0;">🎮 游戏大厅</h1>
    </div>

    <div id="game-list">加载中...</div>

    <script>
        // 获取 URL 参数中的 path（例如 ?path=puzzle）
        const urlParams = new URLSearchParams(window.location.search);
        const currentPath = urlParams.get('path') || 'root';

        const listContainer = document.getElementById('game-list');
        const backBtn = document.getElementById('back-btn');
        const pageTitle = document.getElementById('page-title');

        // 如果不在 root 目录，显示返回按钮
        if (currentPath !== 'root') {
            backBtn.style.display = 'inline-block';
            // 如果是一级目录，返回根目录；如果是多级，这里可以再优化
            pageTitle.innerText = `📂 ${currentPath} 分类`;
        }

        // 请求 JSON 数据并渲染
        fetch('games.json')
            .then(response => response.json())
            .then(data => {
                const games = data[currentPath];
                
                if (!games || games.length === 0) {
                    listContainer.innerHTML = '<p>这里空空如也，还没有添加游戏哦~</p>';
                    return;
                }

                listContainer.innerHTML = ''; // 清空加载提示
                
                games.forEach(game => {
                    const a = document.createElement('a');
                    // 对包含中文和空格的文件名进行 URI 编码，防止 404
                    a.href = encodeURI(game.url);
                    a.className = `game-card ${game.type === 'dir' ? 'dir-card' : ''}`;
                    
                    // 如果是文件夹，就在当前页跳转；如果是文件，就在新标签页打开
                    if (game.type !== 'dir') {
                        //a.target = '_blank'; 
                        // 强制所有卡片（无论是文件夹还是游戏）都在当前页面跳转
                        a.target = '_self';
                    }

                    a.innerHTML = `
                        <div class="game-icon">${game.icon}</div>
                        <div class="game-name">${game.name}</div>
                    `;
                    listContainer.appendChild(a);
                });
            })
            .catch(error => {
                console.error('获取数据失败:', error);
                listContainer.innerHTML = '<p style="color:red;">加载配置失败，请确保通过 HTTP 服务器访问，且 games.json 存在。</p>';
            });
    </script>
</body>
</html>
