<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #faf8ef; color: #776e65;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
  #hud { font-size: 15px; color: #8f857d; height: 22px; }
  #board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: min(90vw, 380px);
    aspect-ratio: 1;
    padding: 8px;
    background: #bbada0;
    border-radius: 10px;
    touch-action: none;
  }
  .cell {
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    background: rgba(238, 228, 218, 0.35);
    font-weight: 700;
    font-size: clamp(24px, 7vw, 40px);
    transition: background 0.08s ease;
  }
  .row { display: flex; gap: 8px; }
  button {
    padding: 10px 18px; border: 0; border-radius: 8px;
    background: #8f7a66; color: #fff; font-size: 15px; cursor: pointer;
  }
  button:active { background: #7f6a56; }
</style>
</head>
<body>
<div class="wrap">
  <h1>2048</h1>
  <div id="hud">分数：<span id="score">0</span> · <span id="msg">方向键 / WASD / 滑动</span></div>
  <div id="board"></div>
  <div class="row">
    <button id="restart">重新开始</button>
  </div>
</div>

<script>
const KEY = '2048-dom-v1';
const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const msgEl = document.getElementById('msg');

const cells = [];
for (let i = 0; i < 16; i++) {
  const d = document.createElement('div');
  d.className = 'cell';
  boardEl.appendChild(d);
  cells.push(d);
}

const COLORS = {
  2: '#eee4da',
  4: '#ede0c8',
  8: '#f2b179',
  16: '#f59563',
  32: '#f67c5f',
  64: '#f65e3b',
  128: '#edcf72',
  256: '#edcc61',
  512: '#edc850',
  1024: '#edc53f',
  2048: '#edc22e'
};

let state;

function addRandom(board) {
  const empty = [];
  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 4; x++) {
      if (!board[y][x]) empty.push([x, y]);
    }
  }
  if (!empty.length) return;
  const [x, y] = empty[Math.floor(Math.random() * empty.length)];
  board[y][x] = Math.random() < 0.9 ? 2 : 4;
}

function initState() {
  const board = Array.from({ length: 4 }, () => Array(4).fill(0));
  addRandom(board);
  addRandom(board);
  return { board, score: 0, over: false };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (
      s &&
      Array.isArray(s.board) &&
      s.board.length === 4 &&
      s.board.every(r => Array.isArray(r) && r.length === 4)
    ) {
      state = {
        board: s.board,
        score: +s.score || 0,
        over: !!s.over
      };
      return;
    }
  } catch (e) {}
  state = initState();
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function render() {
  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 4; x++) {
      const v = state.board[y][x];
      const el = cells[y * 4 + x];
      el.textContent = v || '';
      el.style.background = v ? (COLORS[v] || '#3c3a32') : 'rgba(238, 228, 218, 0.35)';
      el.style.color = v <= 4 ? '#776e65' : '#f9f6f2';
    }
  }

  scoreEl.textContent = state.score;
  msgEl.textContent = state.over ? '游戏结束，按 R 重开' : '方向键 / WASD / 滑动';
}

function slideLeft(row) {
  const arr = row.filter(v => v);
  const out = [];

  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === arr[i + 1]) {
      const v = arr[i] * 2;
      out.push(v);
      state.score += v;
      i++;
    } else {
      out.push(arr[i]);
    }
  }

  while (out.length < 4) out.push(0);
  return out;
}

function checkOver() {
  for (let y = 0; y < 4; y++) {
    for (let x = 0; x < 4; x++) {
      if (!state.board[y][x]) return;
      if (x < 3 && state.board[y][x] === state.board[y][x + 1]) return;
      if (y < 3 && state.board[y][x] === state.board[y + 1][x]) return;
    }
  }
  state.over = true;
}

function move(dir) {
  if (state.over) return;

  let moved = false;

  if (dir === 'left' || dir === 'right') {
    for (let y = 0; y < 4; y++) {
      let row = state.board[y].slice();
      if (dir === 'right') row.reverse();

      const next = slideLeft(row);
      if (dir === 'right') next.reverse();

      if (next.some((v, i) => v !== state.board[y][i])) moved = true;
      state.board[y] = next;
    }
  } else {
    for (let x = 0; x < 4; x++) {
      let col = [
        state.board[0][x],
        state.board[1][x],
        state.board[2][x],
        state.board[3][x]
      ];

      if (dir === 'down') col.reverse();

      const next = slideLeft(col);
      if (dir === 'down') next.reverse();

      for (let y = 0; y < 4; y++) {
        if (state.board[y][x] !== next[y]) moved = true;
        state.board[y][x] = next[y];
      }
    }
  }

  if (!moved) return;

  addRandom(state.board);
  checkOver();
  save();
  render();
}

function restart() {
  state = initState();
  save();
  render();
}

window.addEventListener('keydown', e => {
  const map = {
    ArrowLeft: 'left', a: 'left', A: 'left',
    ArrowRight: 'right', d: 'right', D: 'right',
    ArrowUp: 'up', w: 'up', W: 'up',
    ArrowDown: 'down', s: 'down', S: 'down'
  };

  if (e.key === 'r' || e.key === 'R') {
    restart();
    return;
  }

  const dir = map[e.key];
  if (dir) {
    e.preventDefault();
    move(dir);
  }
});

let sx = 0;
let sy = 0;

boardEl.addEventListener('touchstart', e => {
  const t = e.touches[0];
  sx = t.clientX;
  sy = t.clientY;
}, { passive: true });

boardEl.addEventListener('touchmove', e => {
  e.preventDefault();
}, { passive: false });

boardEl.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const dx = t.clientX - sx;
  const dy = t.clientY - sy;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? 'right' : 'left');
  } else {
    move(dy > 0 ? 'down' : 'up');
  }
});

document.getElementById('restart').addEventListener('click', restart);

load();
render();
</script>
</body>
</html>
