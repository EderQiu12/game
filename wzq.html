<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>网页版五子棋</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            font-family: 'Microsoft YaHei', system-ui, Arial, sans-serif;
            color: #fff;
            padding: 12px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            max-width: 780px;
            width: 100%;
        }

        h1 {
            margin-bottom: 14px;
            text-align: center;
            color: #fff;
            font-size: clamp(20px, 4vw, 28px);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .game-board {
            position: relative;
            width: 100%;
            max-width: min(700px, 72vh);
            aspect-ratio: 1 / 1;
            background-color: #e9b96e;
            border: 2px solid #8b4513;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            touch-action: manipulation;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-top: 14px;
            padding: 6px 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status {
            display: flex;
            align-items: center;
            font-size: clamp(14px, 2.5vw, 18px);
            font-weight: bold;
        }

        .player-indicator {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            margin: 0 10px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            flex: 0 0 auto;
        }

        .black-player {
            background: radial-gradient(circle at 30% 30%, #666, #000);
        }

        .white-player {
            background: radial-gradient(circle at 30% 30%, #fff, #aaa);
            border: 1px solid #aaa;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 15px;
            font-weight: bold;
            color: #fff;
        }

        .size-control input[type="number"] {
            width: 64px;
            padding: 8px 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
        }

        .size-control input[type="number"]::-webkit-outer-spin-button,
        .size-control input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .small-btn { padding: 9px 18px; font-size: 14px; }

        button {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background: linear-gradient(to bottom, #4a6baf, #2c4770);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
        }

        button:hover { background: linear-gradient(to bottom, #5c7fc1, #3c578f); transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: default; transform: none; }

        .result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.82);
            padding: 26px 34px;
            border-radius: 24px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            white-space: nowrap;
        }

        .result h2 { margin-bottom: 18px; font-size: clamp(18px, 4vw, 24px); }

        .hidden { display: none; }

        .hint { margin-top: 8px; font-size: 12px; color: rgba(255, 255, 255, 0.55); }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>五子棋</h1>
        <div class="game-board">
            <canvas id="gobang-board"></canvas>
            <div id="winner-result" class="result hidden">
                <h2 id="winner-text"></h2>
                <button id="new-game-btn">再来一局</button>
            </div>
        </div>
        <div class="info-panel">
            <div class="status">
                当前:
                <div id="current-player" class="player-indicator black-player"></div>
                <span id="player-text">黑棋</span>
            </div>
            <div class="status">
                回合数: <span id="move-count" style="margin-left:6px">0</span>
            </div>
        </div>
        <div class="controls">
            <div class="size-control">
                <span>棋盘</span>
                <input id="size-input" type="number" min="7" max="25" step="2" value="15" inputmode="numeric" title="7～25 路，奇数">
                <span>路</span>
            </div>
            <button id="apply-size" class="small-btn">应用</button>
            <button id="restart-btn">重新开始</button>
        </div>
        <div class="hint">点击 / 触摸棋盘落子</div>
    </div>

    <script>
        const DEFAULT_N = 15;
        const SIZE_KEY = 'gomokuBoardSize';
        let N = DEFAULT_N;                  // 棋盘路数，可在界面上自由设置
        const canvas = document.getElementById('gobang-board');
        const boardEl = document.querySelector('.game-board');
        const ctx = canvas.getContext('2d');

        let board = [];
        let currentPlayer = 1;              // 1 黑, 2 白
        let gameover = false;
        let moveCount = 0;
        let lastMove = null;
        let winCells = null;
        let size = 0, pad = 0, cell = 0;

        // 根据 CSS 尺寸计算棋盘几何
        function measure() {
            size = Math.max(1, Math.round(boardEl.clientWidth));
            pad = Math.max(10, size * 0.045);
            cell = (size - pad * 2) / (N - 1);
        }

        // 按设备像素比设置画布，避免模糊
        function setupCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            canvas.width = Math.round(size * dpr);
            canvas.height = Math.round(size * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function initBoard() {
            board = Array.from({ length: N }, () => Array(N).fill(0));
            currentPlayer = 1;
            gameover = false;
            moveCount = 0;
            lastMove = null;
            winCells = null;
            document.getElementById('move-count').textContent = '0';
            document.getElementById('winner-result').classList.add('hidden');
            document.getElementById('restart-btn').disabled = false;
            updateStatus();
            measure();
            setupCanvas();
            drawBoard();
        }

        function posX(j) { return pad + j * cell; }
        function posY(i) { return pad + i * cell; }

        // 不同路数对应的星位
        function starPointsFor(n) {
            if (n >= 19 && n % 2 === 1) {
                const a = 3, b = (n - 1) / 2, c = n - 4;
                const pts = [];
                for (const i of [a, b, c]) for (const j of [a, b, c]) pts.push([i, j]);
                return pts;
            }
            const m = n <= 9 ? 2 : n <= 15 ? 3 : 4;
            const mid = (n - 1) / 2;
            return [[m, m], [m, n - 1 - m], [n - 1 - m, m], [n - 1 - m, n - 1 - m], [mid, mid]];
        }

        function drawBoard() {
            ctx.clearRect(0, 0, size, size);

            // 木纹底色
            ctx.fillStyle = '#e9b96e';
            ctx.fillRect(0, 0, size, size);

            // 网格
            ctx.strokeStyle = '#5b3a1a';
            ctx.lineWidth = 1;
            for (let i = 0; i < N; i++) {
                const p = posX(i);
                ctx.beginPath();
                ctx.moveTo(p, pad);
                ctx.lineTo(p, size - pad);
                ctx.stroke();
            }
            for (let i = 0; i < N; i++) {
                const p = posY(i);
                ctx.beginPath();
                ctx.moveTo(pad, p);
                ctx.lineTo(size - pad, p);
                ctx.stroke();
            }

            // 星位（根据路数自适应）
            ctx.fillStyle = '#3a2410';
            starPointsFor(N).forEach(([i, j]) => {
                ctx.beginPath();
                ctx.arc(posX(j), posY(i), Math.max(2.5, cell * 0.11), 0, Math.PI * 2);
                ctx.fill();
            });

            // 棋子
            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    if (board[i][j]) drawPiece(i, j, board[i][j]);
                }
            }

            // 最后一手标记
            if (lastMove && !winCells && board[lastMove.i][lastMove.j]) {
                ctx.beginPath();
                ctx.arc(posX(lastMove.j), posY(lastMove.i), Math.max(2, cell * 0.1), 0, Math.PI * 2);
                ctx.fillStyle = '#e11d48';
                ctx.fill();
            }

            // 连五高亮
            if (winCells && winCells.length >= 2) {
                const a = winCells[0], b = winCells[winCells.length - 1];
                ctx.strokeStyle = 'rgba(225, 29, 72, 0.85)';
                ctx.lineWidth = Math.max(3, cell * 0.12);
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(posX(a[1]), posY(a[0]));
                ctx.lineTo(posX(b[1]), posY(b[0]));
                ctx.stroke();
            }
        }

        function drawPiece(i, j, player) {
            const x = posX(j), y = posY(i);
            const r = cell * 0.42;

            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);

            if (player === 1) {
                const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
                g.addColorStop(0, '#777');
                g.addColorStop(1, '#000');
                ctx.fillStyle = g;
                ctx.fill();
            } else {
                const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
                g.addColorStop(0, '#fff');
                g.addColorStop(1, '#c9c9c9');
                ctx.fillStyle = g;
                ctx.fill();
                ctx.strokeStyle = '#8a8a8a';
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }

        // 屏幕坐标 → 棋盘下标
        function getPosition(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * size / rect.width;
            const y = (e.clientY - rect.top) * size / rect.height;
            const i = Math.round((y - pad) / cell);
            const j = Math.round((x - pad) / cell);
            if (i < 0 || i >= N || j < 0 || j >= N) return null;
            return { i, j };
        }

        // 返回构成五连的坐标数组（按方向排序），未连五返回 null
        function checkWin(i, j, player) {
            const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (const [di, dj] of dirs) {
                const line = [[i, j]];
                for (const sign of [1, -1]) {
                    let ni = i + di * sign, nj = j + dj * sign;
                    while (ni >= 0 && ni < N && nj >= 0 && nj < N && board[ni][nj] === player) {
                        line.push([ni, nj]);
                        ni += di * sign;
                        nj += dj * sign;
                    }
                }
                if (line.length >= 5) {
                    // 沿方向排序，保证首尾是两端
                    line.sort((a, b) => (a[0] - b[0]) || (a[1] - b[1]));
                    if (line.length > 5) {
                        // 只保留五连（长度可能超过 5）
                        line.length = 5;
                    }
                    return line;
                }
            }
            return null;
        }

        function placeStone(i, j) {
            if (gameover || board[i][j] !== 0) return;

            board[i][j] = currentPlayer;
            lastMove = { i, j };
            moveCount++;
            document.getElementById('move-count').textContent = moveCount;

            const win = checkWin(i, j, currentPlayer);
            if (win) {
                winCells = win;
                drawBoard();
                gameover = true;
                showResult(currentPlayer === 1 ? '黑棋获胜！' : '白棋获胜！');
                return;
            }

            drawBoard();

            if (moveCount === N * N) {
                gameover = true;
                showResult('平局');
                return;
            }

            currentPlayer = 3 - currentPlayer;
            updateStatus();
        }

        function updateStatus() {
            const dot = document.getElementById('current-player');
            const text = document.getElementById('player-text');
            dot.className = 'player-indicator ' + (currentPlayer === 1 ? 'black-player' : 'white-player');
            text.textContent = currentPlayer === 1 ? '黑棋' : '白棋';
        }

        function showResult(text) {
            document.getElementById('winner-text').textContent = text;
            document.getElementById('winner-result').classList.remove('hidden');
            document.getElementById('restart-btn').disabled = true;
        }

        function restartGame() {
            initBoard();
        }

        // 读取上次保存的棋盘路数
        function loadSavedSize() {
            let saved = NaN;
            try { saved = parseInt(localStorage.getItem(SIZE_KEY), 10); } catch (_) {}
            if (Number.isInteger(saved) && saved >= 7 && saved <= 25 && saved % 2 === 1) {
                N = saved;
            }
            document.getElementById('size-input').value = N;
        }

        // 应用新的棋盘路数
        function applyBoardSize() {
            const input = document.getElementById('size-input');
            let n = parseInt(input.value, 10);
            if (!Number.isFinite(n)) n = N;
            n = Math.max(7, Math.min(25, n));
            if (n % 2 === 0) n++;                 // 只允许奇数路
            input.value = n;

            if (n === N) return;                  // 没变化就不重开
            N = n;
            try { localStorage.setItem(SIZE_KEY, String(N)); } catch (_) {}
            initBoard();
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            e.preventDefault();
            const pos = getPosition(e);
            if (pos) placeStone(pos.i, pos.j);
        });

        document.getElementById('restart-btn').addEventListener('click', restartGame);
        document.getElementById('new-game-btn').addEventListener('click', restartGame);
        document.getElementById('apply-size').addEventListener('click', applyBoardSize);
        document.getElementById('size-input').addEventListener('change', applyBoardSize);

        // 尺寸变化时重新计算，保留棋局
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                measure();
                setupCanvas();
                drawBoard();
            }, 80);
        });

        window.addEventListener('load', () => {
            loadSavedSize();
            initBoard();
        });
        // 字体/布局就绪后校正一次
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(() => {
                measure();
                setupCanvas();
                drawBoard();
            });
        }
    </script>
</body>
</html>
