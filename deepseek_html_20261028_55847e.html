<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎮 我的游戏厅</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 15% -10%, #232c4d 0%, transparent 60%),
      radial-gradient(700px 400px at 90% 0%, #2b1f3d 0%, transparent 55%),
      #0f1115;
    color:#e8eaed;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{max-width:1200px;margin:0 auto;padding:38px 24px 18px}
  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
  h1{margin:0;font-size:clamp(20px,3vw,28px);letter-spacing:.5px}
  #search{
    width:min(320px,70vw);padding:10px 14px;border-radius:10px;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);
    color:inherit;font-size:14px;outline:none;
    transition:border-color .2s,background .2s;
  }
  #search:focus{border-color:#6c8cff;background:rgba(255,255,255,.08)}
  #search::placeholder{color:#7a828f}
  .hint{
    margin-top:14px;font-size:13px;line-height:1.7;color:#f0c674;
    background:rgba(240,198,116,.08);border:1px solid rgba(240,198,116,.25);
    padding:10px 14px;border-radius:10px;
  }
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;max-width:1200px;margin:0 auto;padding:12px 24px 80px;
  }
  .card{
    display:block;text-decoration:none;color:inherit;
    background:#1a1d24;border:1px solid rgba(255,255,255,.07);
    border-radius:16px;overflow:hidden;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
    animation:pop .35s backwards;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:rgba(108,140,255,.6);
    box-shadow:0 14px 32px rgba(0,0,0,.5);
  }
  .card:active{transform:translateY(-1px) scale(.99)}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .thumb{
    aspect-ratio:16/10;display:grid;place-items:center;font-size:46px;
    background:linear-gradient(135deg,#2a3350,#1b2030);
    background-size:cover;background-position:center;
    user-select:none;
  }
  .info{padding:12px 14px}
  .info h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
  .info p{margin:4px 0 0;font-size:12px;color:#8b93a1;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty{text-align:center;color:#8b93a1;padding:60px 20px;font-size:15px}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>🎮 我的游戏厅</h1>
    <input id="search" type="search" placeholder="搜索游戏…" autocomplete="off">
  </div>
  <div id="hint" class="hint" hidden></div>
</header>

<main class="grid" id="grid"></main>
<div class="empty" id="empty" hidden>没有找到游戏 🥲</div>

<script>
/* ==================== 配置区 ==================== */
const CONFIG = {
  autoScan: true,          // 尝试自动扫描同目录下的 html 文件
  sort: true,              // 按标题排序
  exclude: ['index.html'], // 不显示的文件（小写）
  games: [
    // 手动填写（优先级最高，可自定义标题/描述/图标/顺序）
    // { file:'snake.html', title:'贪吃蛇', desc:'经典复刻', icon:'🐍' },
    // { file:'2048.html',  title:'2048',  desc:'数字合并', icon:'🔢' },
  ]
};
/* =============================================== */

const gridEl   = document.getElementById('grid');
const emptyEl  = document.getElementById('empty');
const searchEl = document.getElementById('search');
const hintEl   = document.getElementById('hint');

const ICONS = ['🎮','🕹️','🎲','🧩','🚀','🐍','🧠','♟️','🎯','🏎️','🃏','👾'];

let allGames = [];

/* ---------- 工具 ---------- */
function safeDecode(s){ try{ return decodeURIComponent(s); }catch{ return s; } }

// 把相对路径规范化成浏览器可用的 URL（处理空格、中文、已编码等情况）
function normPath(p){
  return safeDecode(p).split('/').map(encodeURIComponent).join('/');
}

function prettyName(file){
  const base = safeDecode(file).split('/').pop().replace(/\.html?$/i,'');
  return base
    .replace(/[_\-.]+/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .replace(/\b[a-z]/g, c => c.toUpperCase()) || '未命名';
}

/* ---------- 自动扫描目录 ---------- */
async function scanDirectory(){
  try{
    const dir = location.pathname.replace(/[^/]*$/,'');
    const res = await fetch(dir || './', { cache:'no-store' });
    if(!res.ok) return [];
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const map = new Map(); // 原始 href -> 显示文件名
    doc.querySelectorAll('a[href]').forEach(a => {
      let href = (a.getAttribute('href') || '').split('?')[0].split('#')[0];
      if(!/\.html?$/i.test(href)) return;              // 只收 html
      if(/^[a-z][a-z0-9+.-]*:/i.test(href)) return;    // 跳过绝对地址
      href = href.replace(/^\.\//,'');
      const base = safeDecode(href.split('/').pop());
      if(base) map.set(href, base);
    });
    return [...map].map(([file, name]) => ({ file, name }));
  }catch(e){
    return [];
  }
}

/* ---------- 封面图（同名 png/jpg/webp/gif） ---------- */
function loadCover(file, thumbEl){
  const baseRaw = safeDecode(file).replace(/\.html?$/i,'');
  const baseUrl = baseRaw.split('/').map(encodeURIComponent).join('/');
  const exts = ['png','jpg','jpeg','webp','gif'];
  let i = 0;
  (function next(){
    if(i >= exts.length) return;
    const ext = exts[i++];
    const img = new Image();
    img.onload = () => {
      thumbEl.style.backgroundImage = `url("${baseUrl}.${ext}")`;
      thumbEl.textContent = '';
    };
    img.onerror = next;
    img.src = `${baseUrl}.${ext}`;
  })();
}

/* ---------- 创建卡片 ---------- */
function createCard(game, index){
  const a = document.createElement('a');
  a.className = 'card';
  a.href = normPath(game.file);
  a.style.animationDelay = Math.min(index * 35, 500) + 'ms';

  const thumb = document.createElement('div');
  thumb.className = 'thumb';
  thumb.textContent = game.icon || ICONS[index % ICONS.length];

  const info = document.createElement('div');
  info.className = 'info';
  const h3 = document.createElement('h3');
  h3.textContent = game.title;
  const p = document.createElement('p');
  p.textContent = game.desc || safeDecode(game.file);
  info.append(h3, p);

  a.append(thumb, info);
  loadCover(game.file, thumb);
  return a;
}

/* ---------- 渲染 ---------- */
function render(games){
  gridEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  games.forEach((g, i) => frag.appendChild(createCard(g, i)));
  gridEl.appendChild(frag);
  emptyEl.hidden = games.length > 0;
}

/* ---------- 初始化 ---------- */
async function init(){
  const list = [];
  const seen = new Set();

  // 1. 手动配置
  for(const g of (CONFIG.games || [])){
    if(!g || !g.file) continue;
    const key = g.file.toLowerCase();
    if(seen.has(key)) continue;
    seen.add(key);
    list.push({
      file : g.file,
      title: g.title || prettyName(g.file),
      desc : g.desc  || '',
      icon : g.icon  || ''
    });
  }

  // 2. 自动扫描补充
  const excludeSet = new Set((CONFIG.exclude || []).map(s => s.toLowerCase()));
  let scanned = [];
  if(CONFIG.autoScan){
    scanned = await scanDirectory();
    for(const s of scanned){
      const key = s.file.toLowerCase();
      if(seen.has(key)) continue;
      if(excludeSet.has(key) || excludeSet.has(s.name.toLowerCase())) continue;
      if(/^index\.html?$/i.test(s.name)) continue;
      seen.add(key);
      list.push({ file: s.file, title: prettyName(s.name), desc: '', icon: '' });
    }
  }

  if(CONFIG.sort){
    list.sort((x, y) => x.title.localeCompare(y.title, 'zh-CN'));
  }

  allGames = list;
  render(allGames);

  // 提示信息
  if(location.protocol === 'file:'){
    hintEl.hidden = false;
    hintEl.textContent = '⚠️ 当前是 file:// 直接打开，浏览器禁止读取目录，自动扫描不可用。请用本地服务器打开（如 python -m http.server 8000），或在 CONFIG.games 里手动填写游戏列表。';
  }else if(!list.length){
    hintEl.hidden = false;
    hintEl.textContent = '没有扫描到 html 文件：请确认本页面放在游戏同一目录，且服务器开启了目录列表（python -m http.server / nginx autoindex），或直接使用 CONFIG.games 手动配置。';
  }
}

/* ---------- 搜索 ---------- */
searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  if(!q){ render(allGames); return; }
  render(allGames.filter(g =>
    g.title.toLowerCase().includes(q) ||
    g.file.toLowerCase().includes(q) ||
    (g.desc || '').toLowerCase().includes(q)
  ));
});

init();
</script>
</body>
</html>
