<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>游戏大厅</title>
    <meta name="description" content="离线可玩的网页游戏合集：五子棋、贪吃蛇、俄罗斯方块、数独、扫雷、魔方等">
    <meta name="theme-color" content="#1e1e1e">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="游戏大厅">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #1e1e1e;
            color: white;
            padding: 20px clamp(12px, 4vw, 50px);
        }
        .header {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 24px;
        }
        .install-btn {
            margin-left: auto;
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .install-btn:active { background: #2563eb; }
        .install-btn:hover { background: #2563eb; }
        .ios-tip {
            margin: -10px 0 20px;
            font-size: 13px;
            color: #9ca3af;
        }
        [hidden] { display: none !important; }
        .back-btn {
            display: none;
            background: #333;
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
        .back-btn:hover { background: #444; }
        #game-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            background-color: #2d2d2d;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid #444;
            transition: 0.2s;
        }
        .game-card:hover {
            background-color: #3e3e3e;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .game-icon {
            font-size: 40px;
            margin-bottom: 10px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-icon img {
            width: 52px;
            height: 52px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
        }
        .game-name { font-size: 16px; font-weight: bold; text-align: center; padding: 0 10px;}
        .dir-card { background-color: #2a3b4c; border-color: #3e5368; }
        .dir-card:hover { background-color: #354b61; }
    </style>
</head>
<body>

    <div class="header">
        <a href="./" class="back-btn" id="back-btn">⬅ 返回上一级</a>
        <h1 id="page-title" style="margin: 0;">🎮 游戏大厅</h1>
        <button class="install-btn" id="install-btn" hidden>安装到手机</button>
    </div>
    <div class="ios-tip" id="ios-tip" hidden>iPhone / iPad：点 Safari 底部分享按钮 → “添加到主屏幕”</div>

    <div id="game-list">加载中...</div>

    <script>
        // 获取 URL 参数中的 path（例如 ?path=puzzle）
        const urlParams = new URLSearchParams(window.location.search);
        const currentPath = urlParams.get('path') || 'root';

        const listContainer = document.getElementById('game-list');
        const backBtn = document.getElementById('back-btn');
        const pageTitle = document.getElementById('page-title');

        // 如果不在 root 目录，显示返回按钮
        const CATEGORY_NAMES = { puzzle: '益智游戏', action: '动作游戏', MF: '魔方' };
        if (currentPath !== 'root') {
            backBtn.style.display = 'inline-block';
            // 如果是一级目录，返回根目录；如果是多级，这里可以再优化
            pageTitle.textContent = `📂 ${CATEGORY_NAMES[currentPath] || currentPath}`;
        }

        // 请求 JSON 数据并渲染
        fetch('games.json')
            .then(response => response.json())
            .then(data => {
                const games = data[currentPath];
                
                if (!games || games.length === 0) {
                    listContainer.innerHTML = '<p>这里空空如也，还没有添加游戏哦~</p>';
                    return;
                }

                listContainer.innerHTML = ''; // 清空加载提示
                
                games.forEach(game => {
                    const a = document.createElement('a');
                    // 对包含中文和空格的文件名进行 URI 编码，防止 404
                    a.href = encodeURI(game.url);
                    a.className = `game-card ${game.type === 'dir' ? 'dir-card' : ''}`;
                    
                    // 如果是文件夹，就在当前页跳转；如果是文件，就在新标签页打开
                    if (game.type !== 'dir') {
                        //a.target = '_blank'; 
                        // 强制所有卡片（无论是文件夹还是游戏）都在当前页面跳转
                        a.target = '_self';
                    }

                    const iconIsImage = /\.(svg|png|webp|jpg|jpeg)$/i.test(game.icon);
                    a.innerHTML = `
                        <div class="game-icon">${iconIsImage ? `<img src="${game.icon}" alt="" loading="lazy">` : game.icon}</div>
                        <div class="game-name">${game.name}</div>
                    `;
                    listContainer.appendChild(a);
                });
            })
            .catch(error => {
                console.error('获取数据失败:', error);
                listContainer.innerHTML = '<p style="color:red;">加载配置失败，请确保通过 HTTP 服务器访问，且 games.json 存在。</p>';
            });
    </script>
    <script>
        // PWA：注册 Service Worker（安装到手机的必要条件）
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.warn('Service Worker 注册失败:', err);
                });
            });
        }

        // 安装到手机
        const installBtn = document.getElementById('install-btn');
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.hidden = false;
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            try { await deferredPrompt.userChoice; } catch (_) {}
            deferredPrompt = null;
            installBtn.hidden = true;
        });

        window.addEventListener('appinstalled', () => {
            installBtn.hidden = true;
        });

        // iOS 没有 beforeinstallprompt，给出手动添加提示
        (function () {
            const ua = navigator.userAgent;
            const isIOS = /iphone|ipad|ipod/i.test(ua);
            const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
            if (isIOS && !standalone) {
                document.getElementById('ios-tip').hidden = false;
            }
        })();
    </script>
</body>
</html>
