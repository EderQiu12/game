<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>俄罗斯方块</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #101218; color: #eee;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
  #hud { font-size: 13px; color: #aaa; height: 18px; font-variant-numeric: tabular-nums; }
  #hud b { color: #fff; font-weight: 600; }
  #msg { font-size: 12px; color: #7c8598; height: 16px; }
  #board {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    width: max(140px, min(58vw, 280px, calc((100vh - 300px) / 2)));
    aspect-ratio: 1 / 2;
    background: #000;
    gap: 1px;
    padding: 2px;
    border-radius: 8px;
    touch-action: none;
  }
  #board div { background: #171a21; border-radius: 2px; }
  .c1 { background: #00e5ff !important; }
  .c2 { background: #ffe100 !important; }
  .c3 { background: #b44cff !important; }
  .c4 { background: #2979ff !important; }
  .c5 { background: #ff9800 !important; }
  .c6 { background: #00e676 !important; }
  .c7 { background: #ff5252 !important; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 8px 14px; border: 1px solid #444; border-radius: 8px;
    background: #242833; color: #eee; font-size: 14px; cursor: pointer;
    touch-action: manipulation;
  }
  button:active { background: #333a49; }
  .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 6px; }
  .controls button { width: 60px; height: 42px; padding: 0; }
  .controls .empty { visibility: hidden; }
  .touch-hint { display: none; font-size: 12px; color: #7c8598; }
  @media (pointer: coarse) { .touch-hint { display: block; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>俄罗斯方块</h1>
  <div id="hud">分数 <b id="score">0</b> · 最高 <b id="best">0</b> · 消行 <b id="lines">0</b></div>
  <div id="msg">← → ↓ ↑ 空格</div>
  <div id="board"></div>
  <div class="controls">
    <button class="empty"></button>
    <button data-act="rotate">↻</button>
    <button class="empty"></button>
    <button data-act="left">←</button>
    <button data-act="down">↓</button>
    <button data-act="right">→</button>
    <button class="empty"></button>
    <button data-act="drop">硬降</button>
    <button class="empty"></button>
  </div>
  <div class="row">
    <button id="pause">暂停 / 继续</button>
    <button id="restart">重新开始</button>
  </div>
  <div class="touch-hint">滑动：左右移动 · 上滑/轻点旋转 · 下滑软降 · 快速下滑硬降</div>
</div>

<script>
const COLS = 10;
const ROWS = 20;
const KEY = 'tetris-dom-v1';
const BEST_KEY = 'tetris-best-v1';

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const linesEl = document.getElementById('lines');
const msgEl = document.getElementById('msg');

const cells = [];
for (let i = 0; i < COLS * ROWS; i++) {
  const d = document.createElement('div');
  boardEl.appendChild(d);
  cells.push(d);
}

const SHAPES = [
  { c: 1, m: [[1, 1, 1, 1]] },
  { c: 2, m: [[1, 1], [1, 1]] },
  { c: 3, m: [[0, 1, 0], [1, 1, 1]] },
  { c: 4, m: [[1, 0, 0], [1, 1, 1]] },
  { c: 5, m: [[0, 0, 1], [1, 1, 1]] },
  { c: 6, m: [[0, 1, 1], [1, 1, 0]] },
  { c: 7, m: [[1, 1, 0], [0, 1, 1]] }
];

let state;
let timer = null;
let best = Number(localStorage.getItem(BEST_KEY)) || 0;

function newPiece() {
  const s = SHAPES[Math.floor(Math.random() * SHAPES.length)];
  return {
    m: s.m.map(r => r.slice()),
    x: Math.floor((COLS - s.m[0].length) / 2),
    y: 0,
    c: s.c
  };
}

function initState() {
  return {
    board: Array.from({ length: ROWS }, () => Array(COLS).fill(0)),
    piece: newPiece(),
    score: 0,
    lines: 0,
    over: false,
    paused: false
  };
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (
      s &&
      Array.isArray(s.board) &&
      s.board.length === ROWS &&
      s.board.every(r => Array.isArray(r) && r.length === COLS) &&
      s.piece &&
      Array.isArray(s.piece.m) &&
      Array.isArray(s.piece.m[0])
    ) {
      state = {
        board: s.board,
        piece: s.piece,
        score: +s.score || 0,
        lines: +s.lines || 0,
        over: !!s.over,
        paused: !!s.paused
      };
      return;
    }
  } catch (e) {}
  state = initState();
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function render() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const v = state.board[y][x];
      cells[y * COLS + x].className = v ? 'c' + v : '';
    }
  }

  if (!state.over) {
    const p = state.piece;
    for (let r = 0; r < p.m.length; r++) {
      for (let c = 0; c < p.m[r].length; c++) {
        if (!p.m[r][c]) continue;
        const x = p.x + c;
        const y = p.y + r;
        if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
          cells[y * COLS + x].className = 'c' + p.c;
        }
      }
    }
  }

  if (state.score > best) {
    best = state.score;
    localStorage.setItem(BEST_KEY, best);
  }

  scoreEl.textContent = state.score;
  bestEl.textContent = best;
  linesEl.textContent = state.lines;

  if (state.over) msgEl.textContent = '游戏结束，按 R 重开';
  else if (state.paused) msgEl.textContent = '已暂停';
  else msgEl.textContent = '← → ↓ ↑ 空格';
}

function collide(p, dx = 0, dy = 0, m = p.m) {
  for (let r = 0; r < m.length; r++) {
    for (let c = 0; c < m[r].length; c++) {
      if (!m[r][c]) continue;
      const x = p.x + c + dx;
      const y = p.y + r + dy;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && state.board[y][x]) return true;
    }
  }
  return false;
}

function clearLines() {
  let count = 0;
  const kept = [];
  for (const row of state.board) {
    if (row.every(v => v)) count++;
    else kept.push(row);
  }
  while (kept.length < ROWS) kept.unshift(Array(COLS).fill(0));
  state.board = kept;

  if (count) {
    state.lines += count;
    state.score += [0, 100, 300, 500, 800][count] || 0;
  }
  return count;
}

function resetTimer() {
  clearInterval(timer);
  timer = setInterval(tick, Math.max(120, 600 - state.lines * 15));
}

function gameOver() {
  state.over = true;
  clearInterval(timer);
  timer = null;
  if (state.score > best) {
    best = state.score;
    localStorage.setItem(BEST_KEY, best);
  }
  save();
  render();
}

function lockPiece() {
  const p = state.piece;
  for (let r = 0; r < p.m.length; r++) {
    for (let c = 0; c < p.m[r].length; c++) {
      if (!p.m[r][c]) continue;
      const x = p.x + c;
      const y = p.y + r;
      if (y >= 0 && y < ROWS && x >= 0 && x < COLS) {
        state.board[y][x] = p.c;
      }
    }
  }

  const cleared = clearLines();
  state.piece = newPiece();

  if (collide(state.piece)) {
    gameOver();
    return;
  }
  if (cleared) resetTimer();

  save();
  render();
}

function tick() {
  if (state.over || state.paused) return;

  if (!collide(state.piece, 0, 1)) {
    state.piece.y++;
    render();
  } else {
    lockPiece();
  }
}

function move(dx) {
  if (state.over || state.paused) return;
  if (!collide(state.piece, dx, 0)) {
    state.piece.x += dx;
    save();
    render();
  }
}

function softDrop() {
  if (state.over || state.paused) return;
  if (!collide(state.piece, 0, 1)) {
    state.piece.y++;
    save();
    render();
  } else {
    lockPiece();
  }
}

function rotate() {
  if (state.over || state.paused) return;
  const m = state.piece.m;
  const rotated = m[0].map((_, i) => m.map(row => row[i]).reverse());

  for (const kick of [0, -1, 1, -2, 2]) {
    if (!collide(state.piece, kick, 0, rotated)) {
      state.piece.m = rotated;
      state.piece.x += kick;
      save();
      render();
      return;
    }
  }
}

function hardDrop() {
  if (state.over || state.paused) return;
  while (!collide(state.piece, 0, 1)) state.piece.y++;
  lockPiece();
}

function togglePause() {
  if (state.over) return;
  state.paused = !state.paused;
  save();
  render();
}

function restart() {
  state = initState();
  save();
  render();
  resetTimer();
}

window.addEventListener('keydown', e => {
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (!e.repeat) hardDrop();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    e.preventDefault(); move(-1); return;
  }
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    e.preventDefault(); move(1); return;
  }
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
    e.preventDefault(); softDrop(); return;
  }
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
    e.preventDefault(); if (!e.repeat) rotate(); return;
  }
  if (e.key === 'p' || e.key === 'P') {
    if (!e.repeat) togglePause(); return;
  }
  if (e.key === 'r' || e.key === 'R') {
    if (!e.repeat) restart();
  }
});

document.querySelectorAll('[data-act]').forEach(btn => {
  btn.addEventListener('click', () => {
    const act = btn.dataset.act;
    if (act === 'left') move(-1);
    if (act === 'right') move(1);
    if (act === 'down') softDrop();
    if (act === 'rotate') rotate();
    if (act === 'drop') hardDrop();
  });
});
document.getElementById('pause').addEventListener('click', togglePause);
document.getElementById('restart').addEventListener('click', restart);

// 触摸手势：在棋盘上滑动
let touchStart = null;

boardEl.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY, t: Date.now() };
}, { passive: true });

boardEl.addEventListener('touchmove', e => {
  if (touchStart) e.preventDefault();
}, { passive: false });

boardEl.addEventListener('touchend', e => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x;
  const dy = t.clientY - touchStart.y;
  const dt = Date.now() - touchStart.t;
  touchStart = null;

  const ax = Math.abs(dx), ay = Math.abs(dy);

  // 轻点 = 旋转
  if (Math.max(ax, ay) < 20) {
    if (dt < 300) rotate();
    return;
  }

  if (ax > ay) {
    // 横向滑动，滑动距离越长移动越多格
    const steps = Math.min(5, Math.max(1, Math.round(ax / 28)));
    for (let i = 0; i < steps; i++) move(dx > 0 ? 1 : -1);
  } else if (dy < 0) {
    rotate();
  } else if (dy > 90 && dt < 350) {
    hardDrop();
  } else {
    softDrop();
  }
}, { passive: true });

load();
render();
resetTimer();
</script>
</body>
</html>
