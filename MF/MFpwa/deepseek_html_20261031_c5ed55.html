<!DOCTYPE html>
<meta charset="utf-8">
<title>生成魔方图标 PNG</title>
<style>
  body{background:#0b1120;color:#e2e8f0;font-family:system-ui;display:flex;flex-direction:column;
       align-items:center;gap:16px;padding:32px}
  button{font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #3b82f6;
         background:#2563eb;color:#fff;cursor:pointer}
  canvas{background:#111;border-radius:12px}
</style>

<h2>魔方图标生成器</h2>
<canvas id="preview" width="192" height="192"></canvas>
<button id="go">下载 192 / 512 / maskable 三张 PNG</button>

<script>
const P00 = { top: [256,105], left: [124,181], right: [256,257] };

function bilinear(p00, p10, p01, p11, u, v) {
  return [
    (1-u)*(1-v)*p00[0] + u*(1-v)*p10[0] + (1-u)*v*p01[0] + u*v*p11[0],
    (1-u)*(1-v)*p00[1] + u*(1-v)*p10[1] + (1-u)*v*p01[1] + u*v*p11[1]
  ];
}

// 三面四角（512 坐标系）
const TOP  = { p00:[256,105], p10:[388,181], p01:[124,181], p11:[256,257] };
const LEFT = { p00:[124,181], p10:[256,257], p01:[124,331], p11:[256,407] };
const RIGHT= { p00:[256,257], p10:[388,181], p01:[256,407], p11:[388,331] };

function poly(ctx, pts, fill) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
}

function faceGrid(ctx, f, lineWidth) {
  ctx.strokeStyle = '#0b1120';
  ctx.lineWidth = lineWidth;
  ctx.lineCap = 'round';
  const lines = [];
  for (const t of [1/3, 2/3]) {
    // u 方向的线（v: 0→1）
    lines.push([bilinear(f.p00,f.p10,f.p01,f.p11,t,0), bilinear(f.p00,f.p10,f.p01,f.p11,t,1)]);
    // v 方向的线（u: 0→1）
    lines.push([bilinear(f.p00,f.p10,f.p01,f.p11,0,t), bilinear(f.p00,f.p10,f.p01,f.p11,1,t)]);
  }
  for (const [a,b] of lines) {
    ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
  }
}

function drawIcon(size, pad) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#0b1120';
  ctx.fillRect(0, 0, size, size);

  const inner = size - pad * 2;
  ctx.save();
  ctx.translate(pad, pad);
  ctx.scale(inner / 512, inner / 512);

  poly(ctx, [TOP.p00, TOP.p10, TOP.p11, TOP.p01], '#f8fafc');
  poly(ctx, [LEFT.p00, LEFT.p10, LEFT.p11, LEFT.p01], '#22c55e');
  poly(ctx, [RIGHT.p00, RIGHT.p10, RIGHT.p11, RIGHT.p01], '#ef4444');

  const lw = 9 * (512 / inner);
  faceGrid(ctx, TOP, lw);
  faceGrid(ctx, LEFT, lw);
  faceGrid(ctx, RIGHT, lw);

  ctx.restore();
  return c;
}

function toBlob(canvas) {
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}
async function download(canvas, name) {
  const blob = await toBlob(canvas);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// 预览
const pv = document.getElementById('preview').getContext('2d');
pv.drawImage(drawIcon(192, 0), 0, 0);

document.getElementById('go').onclick = async () => {
  await download(drawIcon(192, 0), 'icon-192.png');
  await download(drawIcon(512, 0), 'icon-512.png');
  await download(drawIcon(512, 64), 'icon-512-maskable.png'); // 留安全边距
};
</script>
